services:
  notion-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: notion-ai-wrapper:latest
    container_name: notion_ai_service
    restart: always
    # Public exposure requires an explicit HOST_BIND override and access controls.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DB_PATH=/app/data/conversations.db
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-UTC}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./accounts.json:/app/accounts.json:ro
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    # Docker reports unhealthy status; restart: always alone does not restart
    # an otherwise running unhealthy container.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
